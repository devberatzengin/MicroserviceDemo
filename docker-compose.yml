version: '3.8'

services:
  # 🐘 Patient-Service'in kullanacağı bağımsız PostgreSQL veritabanı
  patient-db:
    image: postgres:15-alpine
    container_name: medix-patient-db
    environment:
      POSTGRES_DB: medix_patient_db
      POSTGRES_USER: patient_user
      POSTGRES_PASSWORD: patient_password
    ports:
      - "5432:5432"
    volumes:
      - patient_db_data:/var/lib/postgresql/data

  appointment-db:
    image: postgres:15-alpine
    container_name: medix-appointment-db
    environment:
      POSTGRES_DB: medix_appointment_db
      POSTGRES_USER: appointment_user
      POSTGRES_PASSWORD: appointment_password
    ports:
      - "5433:5433"
    volumes:
      - appointment_db_data:/var/lib/postgresql/data

volumes:
  patient_db_data: # Konteyner kapansa bile verilerin uçmaması için MacBook'ta disk alanı ayırır kanka
  appointment_db_data: